        &lt;h2 id=&quot;ecr-calc-title&quot;&gt;AI 服务器单柜经济性&lt;/h2&gt;

        const line = textEl(&quot;div&quot;, &quot;ecr-tooltip-row text-small&quot;);
        const dot = textEl(&quot;span&quot;, &quot;ecr-tooltip-swatch&quot;);
        dot.style.setProperty(&quot;--ecr-swatch&quot;, color(row.item.colorIndex));
        const value = isMaterial
          ? `${d3.format(&quot;,.3~f&quot;)(row.original)} ${row.item.unit} · ${row.shown &gt;= 0 ? &quot;+&quot; : &quot;&quot;}${d3.format(&quot;.1f&quot;)(row.shown)}%`
          : `${d3.format(&quot;,.3~f&quot;)(row.shown)} ${row.item.unit}`;
        line.append(dot, textEl(&quot;span&quot;, &quot;&quot;, row.item.label), textEl(&quot;span&quot;, &quot;&quot;, value));
        tooltip.append(line);
      });
      if (!rows.length) return;
      tooltip.hidden = false;
      tooltip.style.left = `${Math.min(width - 150, Math.max(8, snapPx + 12))}px`;
      tooltip.style.top = &quot;10px&quot;;
    };

    svg.addEventListener(&quot;pointermove&quot;, event =&gt; {
      if (!state.pinned || event.pointerType === &quot;mouse&quot;) {
        state.pinned = state.pinned &amp;&amp; event.pointerType === &quot;touch&quot;;
        show(event);
      }
    });
    svg.addEventListener(&quot;pointerleave&quot;, hide);
    svg.addEventListener(&quot;pointerdown&quot;, event =&gt; {
      if (event.pointerType === &quot;touch&quot; || event.pointerType === &quot;pen&quot;) {
        state.pinned = true;
        show(event);
      }
    });
    svg.addEventListener(&quot;keydown&quot;, event =&gt; {
      if (event.key === &quot;Escape&quot;) {
        state.pinned = false;
        hide();
      }
    });
    shell.addEventListener(&quot;pointerleave&quot;, hide);
  }

  function drawChip() {
    const svg = d3.select(&quot;#ecr-chip-chart&quot;);
    const node = svg.node();
    if (!node || !node.parentElement || !node.parentElement.offsetParent) return;
    const frame = chartFrame(node, &quot;DRAM 与 NAND 价格趋势&quot;, &quot;DRAM 现货、合约与 NAND 现货。纵轴为对数刻度，长间隔观察值之间不连线。&quot;);
    frame.yTitle = &quot;价格（美元/颗，对数）&quot;;
    const bounds = { left: frame.margin.left, top: frame.margin.top, width: frame.innerWidth, height: frame.innerHeight };
    const active = chipSeries.filter(item =&gt; state.chipVisible.has(item.key));
    const prepared = active.map(item =&gt; {
      const points = clipObservations(item, state.chipMonths);
      return { ...item, points };
    }).filter(item =&gt; item.points.length);
    const start = windowStart(state.chipMonths);
    const allDates = prepared.flatMap(item =&gt; item.points.map(d =&gt; d.x));
    if (!allDates.length) {
      drawEmpty(node, &quot;当前时间范围没有可展示的芯片价格观测&quot;);
      return;
    }
    const xDomain = [start || d3.min(allDates), endDate];
    let extent = d3.extent(prepared.flatMap(item =&gt; item.points.map(d =&gt; d.value)));
    if (extent[0] === extent[1]) extent = [extent[0] / 1.25, extent[1] * 1.25];
    const xScale = d3.scaleUtc().domain(xDomain).range([bounds.left, bounds.left + bounds.width]);
    const yScale = d3.scaleLog().domain([extent[0] / 1.25, extent[1] * 1.25]).nice().range([bounds.top + bounds.height, bounds.top]);
    const plot = d3.select(node).append(&quot;g&quot;);
    plot.append(&quot;g&quot;)
      .attr(&quot;transform&quot;, `translate(${bounds.left},0)`)
      .call(d3.axisLeft(yScale).ticks(frame.mobile ? 5 : 7, &quot;~g&quot;).tickSize(-bounds.width).tickFormat(d =&gt; d3.format(&quot;~g&quot;)(d)))
      .call(g =&gt; g.selectAll(&quot;.tick line&quot;).attr(&quot;class&quot;, &quot;ecr-grid-line&quot;))
      .call(g =&gt; g.selectAll(&quot;.tick text&quot;).attr(&quot;font-size&quot;, 11))
      .call(g =&gt; g.select(&quot;.domain&quot;).attr(&quot;class&quot;, &quot;ecr-axis-line&quot;));
    plot.append(&quot;g&quot;)
      .attr(&quot;transform&quot;, `translate(0,${bounds.top + bounds.height})`)
      .call(d3.axisBottom(xScale).ticks(frame.mobile ? 4 : 7, frame.mobile ? d3.utcMonth.every(3) : d3.utcMonth.every(2)).tickFormat(monthFormat))
      .call(g =&gt; g.selectAll(&quot;.tick text&quot;).attr(&quot;font-size&quot;, 11))
      .call(g =&gt; g.select(&quot;.domain&quot;).attr(&quot;class&quot;, &quot;ecr-axis-line&quot;));

    const line = d3.line().x(d =&gt; xScale(d.x)).y(d =&gt; yScale(d.value));
    const clip = `chip-clip-${Date.now()}`;
    plot.append(&quot;defs&quot;).append(&quot;clipPath&quot;).attr(&quot;id&quot;, clip).append(&quot;rect&quot;)
      .attr(&quot;x&quot;, bounds.left).attr(&quot;y&quot;, bounds.top).attr(&quot;width&quot;, bounds.width).attr(&quot;height&quot;, bounds.height);
    const seriesLayer = plot.append(&quot;g&quot;).attr(&quot;clip-path&quot;, `url(#${clip})`);
    prepared.forEach((item, index) =&gt; {
      item.points.forEach(point =&gt; { point.renderedY = yScale(point.value); });
      splitRuns(item.points, (a, b) =&gt; b - a &gt; 120 * 86400000).forEach(run =&gt; {
        if (run.length &gt; 1) {
          seriesLayer.append(&quot;path&quot;).datum(run).attr(&quot;d&quot;, line).attr(&quot;fill&quot;, &quot;none&quot;)
            .attr(&quot;stroke&quot;, color(item.colorIndex)).attr(&quot;stroke-width&quot;, 2).attr(&quot;stroke-linecap&quot;, &quot;round&quot;);
        }
      });
      seriesLayer.selectAll(null).data(item.points).join(&quot;circle&quot;)
        .attr(&quot;cx&quot;, d =&gt; xScale(d.x)).attr(&quot;cy&quot;, d =&gt; yScale(d.value)).attr(&quot;r&quot;, 2.8)
        .attr(&quot;fill&quot;, &quot;var(--background)&quot;).attr(&quot;stroke&quot;, color(item.colorIndex)).attr(&quot;stroke-width&quot;, 2)
        .attr(&quot;aria-label&quot;, null);
    });
    const guide = plot.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;ecr-hover-guide&quot;)
      .attr(&quot;y1&quot;, bounds.top).attr(&quot;y2&quot;, bounds.top + bounds.height).style(&quot;display&quot;, &quot;none&quot;).node();
    drawAxisLabels(node, frame);
    setupInteraction({
      svg: node, shell: $(&quot;#ecr-chip-shell&quot;), tooltip: $(&quot;#ecr-chip-tooltip&quot;), guide,
      series: prepared, xScale, yScale, width: frame.width, height: frame.height, isMaterial: false
    });
  }

  function drawMaterial() {
    const svg = d3.select(&quot;#ecr-material-chart&quot;);
    const node = svg.node();
    if (!node || !node.parentElement || !node.parentElement.offsetParent) return;
    const frame = chartFrame(node, &quot;关键材料价格相对走势&quot;, &quot;铜、金、银、铝、镍、锡以所选窗口首个观测归一化。缺月处不插值，曲线断开。&quot;);
    frame.yTitle = &quot;相对窗口起点（%）&quot;;
    const bounds = { left: frame.margin.left, top: frame.margin.top, width: frame.innerWidth, height: frame.innerHeight };
    const start = windowStart(state.materialMonths);
    const prepared = materialSeries.filter(item =&gt; state.materialVisible.has(item.key)).map(item =&gt; {
      const points = clipObservations(item, state.materialMonths);
      if (!points.length) return null;
      const base = points[0].value;
      return { ...item, points: points.map(d =&gt; ({ ...d, relative: (d.value / base - 1) * 100 })) };
    }).filter(Boolean);
    const allDates = prepared.flatMap(item =&gt; item.points.map(d =&gt; d.x));
    if (!allDates.length) {
      drawEmpty(node, &quot;当前时间范围没有可展示的材料价格观测&quot;);
      return;
    }
    const xDomain = [start || d3.min(allDates), endDate];
    let extent = d3.extent(prepared.flatMap(item =&gt; item.points.map(d =&gt; d.relative)));
    if (extent[0] === extent[1]) extent = [extent[0] - 1, extent[1] + 1];
    const xScale = d3.scaleUtc().domain(xDomain).range([bounds.left, bounds.left + bounds.width]);
    const yScale = d3.scaleLinear().domain(extent).nice().range([bounds.top + bounds.height, bounds.top]);
    const plot = d3.select(node).append(&quot;g&quot;);
    plot.append(&quot;g&quot;)
      .attr(&quot;transform&quot;, `translate(${bounds.left},0)`)
      .call(d3.axisLeft(yScale).ticks(frame.mobile ? 5 : 7).tickSize(-bounds.width).tickFormat(d =&gt; `${d &gt; 0 ? &quot;+&quot; : &quot;&quot;}${d}%`))
      .call(g =&gt; g.selectAll(&quot;.tick line&quot;).attr(&quot;class&quot;, &quot;ecr-grid-line&quot;))
      .call(g =&gt; g.selectAll(&quot;.tick text&quot;).attr(&quot;font-size&quot;, 11))
      .call(g =&gt; g.select(&quot;.domain&quot;).attr(&quot;class&quot;, &quot;ecr-axis-line&quot;));
    plot.append(&quot;g&quot;)
      .attr(&quot;transform&quot;, `translate(0,${bounds.top + bounds.height})`)
      .call(d3.axisBottom(xScale).ticks(frame.mobile ? 4 : 7, frame.mobile ? d3.utcMonth.every(6) : d3.utcMonth.every(3)).tickFormat(monthFormat))
      .call(g =&gt; g.selectAll(&quot;.tick text&quot;).attr(&quot;font-size&quot;, 11))
      .call(g =&gt; g.select(&quot;.domain&quot;).attr(&quot;class&quot;, &quot;ecr-axis-line&quot;));
    if (yScale.domain()[0] &lt;= 0 &amp;&amp; yScale.domain()[1] &gt;= 0) {
      plot.append(&quot;line&quot;).attr(&quot;x1&quot;, bounds.left).attr(&quot;x2&quot;, bounds.left + bounds.width)
        .attr(&quot;y1&quot;, yScale(0)).attr(&quot;y2&quot;, yScale(0))
        .attr(&quot;stroke&quot;, &quot;var(--muted-foreground)&quot;).attr(&quot;stroke-width&quot;, 1).attr(&quot;stroke-dasharray&quot;, &quot;4 4&quot;);
    }
    const line = d3.line().x(d =&gt; xScale(d.x)).y(d =&gt; yScale(d.relative));
    const clip = `material-clip-${Date.now()}`;
    plot.append(&quot;defs&quot;).append(&quot;clipPath&quot;).attr(&quot;id&quot;, clip).append(&quot;rect&quot;)
      .attr(&quot;x&quot;, bounds.left).attr(&quot;y&quot;, bounds.top).attr(&quot;width&quot;, bounds.width).attr(&quot;height&quot;, bounds.height);
    const seriesLayer = plot.append(&quot;g&quot;).attr(&quot;clip-path&quot;, `url(#${clip})`);
    prepared.forEach(item =&gt; {
      splitRuns(item.points, (a, b) =&gt; monthGap(a, b) &gt; 1).forEach(run =&gt; {
        if (run.length &gt; 1) {
          seriesLayer.append(&quot;path&quot;).datum(run).attr(&quot;d&quot;, line).attr(&quot;fill&quot;, &quot;none&quot;)
            .attr(&quot;stroke&quot;, color(item.colorIndex)).attr(&quot;stroke-width&quot;, 2).attr(&quot;stroke-linejoin&quot;, &quot;round&quot;);
        }
      });
      seriesLayer.selectAll(null).data(item.points).join(&quot;circle&quot;)
        .attr(&quot;cx&quot;, d =&gt; xScale(d.x)).attr(&quot;cy&quot;, d =&gt; yScale(d.relative)).attr(&quot;r&quot;, 1.8)
        .attr(&quot;fill&quot;, color(item.colorIndex));
    });
    const guide = plot.append(&quot;line&quot;).attr(&quot;class&quot;, &quot;ecr-hover-guide&quot;)
      .attr(&quot;y1&quot;, bounds.top).attr(&quot;y2&quot;, bounds.top + bounds.height).style(&quot;display&quot;, &quot;none&quot;).node();
    drawAxisLabels(node, frame);
    setupInteraction({
      svg: node, shell: $(&quot;#ecr-material-shell&quot;), tooltip: $(&quot;#ecr-material-tooltip&quot;), guide,
      series: prepared, xScale, yScale, width: frame.width, height: frame.height, isMaterial: true
    });
  }

  function renderCalculator() {
    const form = $(&quot;#ecr-calc-form&quot;);
    const error = $(&quot;#ecr-calc-error&quot;);
    const hbmIncluded = $(&quot;#ecr-hbm-included&quot;).checked;
    $(&quot;#ecr-hbm-stacks&quot;).disabled = hbmIncluded;
    $(&quot;#ecr-hbm-price&quot;).disabled = hbmIncluded;

    const numberValue = id =&gt; {
      const value = Number($(id).value);
      return Number.isFinite(value) ? value : 0;
    };
    const values = {
      gpuCount: numberValue(&quot;#ecr-gpu-count&quot;),
      gpuPrice: numberValue(&quot;#ecr-gpu-price&quot;),
      compute: numberValue(&quot;#ecr-compute&quot;),
      hbmStacks: numberValue(&quot;#ecr-hbm-stacks&quot;),
      hbmPrice: numberValue(&quot;#ecr-hbm-price&quot;),
      ram: numberValue(&quot;#ecr-ram-value&quot;),
      ssd: numberValue(&quot;#ecr-ssd-value&quot;),
      opticsCount: numberValue(&quot;#ecr-optics-count&quot;),
      opticsPrice: numberValue(&quot;#ecr-optics-price&quot;),
      network: numberValue(&quot;#ecr-network-value&quot;),
      pcb: numberValue(&quot;#ecr-pcb-value&quot;),
      power: numberValue(&quot;#ecr-power-value&quot;),
      assembly: numberValue(&quot;#ecr-assembly-value&quot;),
      yieldPct: numberValue(&quot;#ecr-yield&quot;),
      rackAsp: numberValue(&quot;#ecr-rack-asp&quot;),
      taxPct: numberValue(&quot;#ecr-tax-rate&quot;),
      targetPct: numberValue(&quot;#ecr-target-margin&quot;)
    };
    const negativeFields = [
      [&quot;#ecr-gpu-count&quot;, &quot;加速器数量&quot;],
      [&quot;#ecr-gpu-price&quot;, &quot;加速器单价&quot;],
      [&quot;#ecr-ram-value&quot;, &quot;系统 DRAM&quot;],
      [&quot;#ecr-ssd-value&quot;, &quot;企业级 SSD&quot;],
      [&quot;#ecr-optics-count&quot;, &quot;光模块数量&quot;],
      [&quot;#ecr-optics-price&quot;, &quot;光模块单价&quot;],
      [&quot;#ecr-network-value&quot;, &quot;交换与网络&quot;],
      [&quot;#ecr-pcb-value&quot;, &quot;PCB / CCL&quot;],
      [&quot;#ecr-power-value&quot;, &quot;电源与散热&quot;],
      [&quot;#ecr-assembly-value&quot;, &quot;组装测试保修&quot;],
      [&quot;#ecr-rack-asp&quot;, &quot;整柜 ASP&quot;],
      [&quot;#ecr-target-margin&quot;, &quot;目标贡献率&quot;]
    ];
    if (!hbmIncluded) {
      negativeFields.splice(2, 0,
        [&quot;#ecr-hbm-stacks&quot;, &quot;HBM 堆栈数&quot;],
        [&quot;#ecr-hbm-price&quot;, &quot;HBM 堆栈价格&quot;]
      );
    }
    const invalidNegativeField = negativeFields.find(([selector]) =&gt; numberValue(selector) &lt; 0);
    let validationMessage = &quot;&quot;;
    if (invalidNegativeField) validationMessage = `${invalidNegativeField[1]}不能为负数。`;
    else if (values.yieldPct &lt;= 0 || values.yieldPct &gt; 100) validationMessage = &quot;系统良率必须大于 0% 且不超过 100%。&quot;;
    else if (values.compute &lt;= 0) validationMessage = &quot;整柜算力必须大于 0 PFLOPS。&quot;;
    else if (values.taxPct &lt;= -100) validationMessage = &quot;税费率必须高于 -100%。&quot;;

    const amount = new Intl.NumberFormat(&quot;en-US&quot;, {
      style: &quot;currency&quot;,
      currency: &quot;USD&quot;,
      maximumFractionDigits: 0
    });
    const compactAmount = new Intl.NumberFormat(&quot;en-US&quot;, {
      style: &quot;currency&quot;,
      currency: &quot;USD&quot;,
      notation: &quot;compact&quot;,
      maximumFractionDigits: 1
    });
    const legacyBar = $(&quot;#ecr-calc-bar&quot;);
    const setMetric = (selector, value, compact = false) =&gt; {
      const node = $(selector);
      node.textContent = validationMessage ? &quot;—&quot; : (compact ? compactAmount : amount).format(value);
      node.classList.toggle(&quot;is-negative&quot;, !validationMessage &amp;&amp; Number(value) &lt; 0);
    };
    const resetSegments = () =&gt; {
      [&quot;compute&quot;, &quot;memory&quot;, &quot;network&quot;, &quot;pcb&quot;, &quot;power&quot;, &quot;buffer&quot;].forEach(key =&gt; {
        const node = $(`#ecr-seg-${key}`);
        node.style.flexGrow = &quot;0&quot;;
        node.style.flexBasis = &quot;0&quot;;
      });
      $(&quot;#ecr-calc-legend&quot;).replaceChildren();
      legacyBar.setAttribute(&quot;aria-label&quot;, &quot;当前输入无效，暂无可展示的单柜 BOM 结构。&quot;);
    };

    if (validationMessage) {
      error.textContent = validationMessage;
      error.hidden = false;
      setMetric(&quot;#ecr-out-bom&quot;, 0);
      setMetric(&quot;#ecr-out-per-pflops&quot;, 0);
      setMetric(&quot;#ecr-out-breakeven&quot;, 0);
      setMetric(&quot;#ecr-out-contribution&quot;, 0, true);
      $(&quot;#ecr-out-contribution-note&quot;).textContent = &quot;请先修正输入&quot;;
      $(&quot;#ecr-hbm-mode-note&quot;).textContent = hbmIncluded
        ? &quot;加速器单价视为已包含 HBM，本计算不单列 HBM。&quot;
        : &quot;HBM 将按堆栈数与单价独立计入，避免与加速器价格重复计算。&quot;;
      resetSegments();
      return;
    }

    error.hidden = true;
    error.textContent = &quot;&quot;;
    const yieldFactor = values.yieldPct / 100;
    const taxFactor = values.taxPct / 100 + 1;
    const hbmValue = hbmIncluded ? 0 : values.gpuCount * values.hbmStacks * values.hbmPrice;
    const computeValue = values.gpuCount * values.gpuPrice;
    const memoryValue = hbmValue + values.ram + values.ssd;
    const networkValue = values.opticsCount * values.opticsPrice + values.network;
    const hardwareBom = computeValue + memoryValue + networkValue + values.pcb + values.power;
    const adjustedBom = hardwareBom / yieldFactor + values.assembly;
    const netRevenue = values.rackAsp / taxFactor;
    const contribution = netRevenue - adjustedBom;
    const contributionRate = netRevenue &gt; 0 ? contribution / netRevenue * 100 : 0;
    const perPflops = adjustedBom / values.compute;
    const breakEvenAsp = adjustedBom * taxFactor;
    const difference = contributionRate - values.targetPct;

    setMetric(&quot;#ecr-out-bom&quot;, adjustedBom);
    setMetric(&quot;#ecr-out-per-pflops&quot;, perPflops);
    setMetric(&quot;#ecr-out-breakeven&quot;, breakEvenAsp);
    setMetric(&quot;#ecr-out-contribution&quot;, contribution, true);
    $(&quot;#ecr-out-contribution-note&quot;).textContent = difference &gt;= 0
      ? `贡献率 ${contributionRate.toFixed(1)}%，高于目标 ${Math.abs(difference).toFixed(1)}pct`
      : `贡献率 ${contributionRate.toFixed(1)}%，低于目标 ${Math.abs(difference).toFixed(1)}pct`;

    const embeddedHbmValue = values.gpuCount * values.hbmStacks * values.hbmPrice;
    $(&quot;#ecr-hbm-mode-note&quot;).textContent = hbmIncluded
