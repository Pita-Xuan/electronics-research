name: Update electronics research data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: electronics-research-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public data
        run: python -m collectors.run_all

      - name: Commit changed data
        run: |
          git config user.name "electronics-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update electronics research data"
            git push
          fi
